# Explicit project name so container/volume names don't depend on the
# checkout directory name.
name: switchyard-opencode

services:
  switchyard:
    build: .
    container_name: switchyard-opencode
    ports:
      # Loopback only — never expose the router on the LAN.
      - '127.0.0.1:4100:4100'
    env_file:
      - .env
    volumes:
      - ./route.yaml:/app/route.yaml:ro
      # Named volume (not a bind mount — avoids host-permission surprises)
      # so the routing JSONL survives `up -d --force-recreate` (key
      # rotation) and image rebuilds. Retrieve it with `docker cp` /
      # scripts/stats-snapshot.sh, or read the aggregate at
      # GET /v1/routing/stats.
      - switchyard-logs:/app/logs
    # Adds the per-request routing JSONL on top of the image CMD.
    command:
      [
        'switchyard',
        '--routing-profiles',
        '/app/route.yaml',
        'serve',
        '--host',
        '0.0.0.0',
        '--port',
        '4100',
        '--routing-log-file',
        '/app/logs/routing.jsonl',
      ]
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4100/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Keyless web-search backend (bundle v2). opencode reaches it through the
  # mcp-searxng tool (see opencode.jsonc.example); only the agent's search
  # query strings leave the machine, toward regular search engines.
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: switchyard-searxng
    ports:
      # Loopback only — never expose the search UI/API on the LAN.
      - '127.0.0.1:8888:8080'
    volumes:
      # rw: the container writes generated files next to settings.yml
      # (kept out of git via .gitignore).
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      # Set in .env: SEARXNG_SECRET=$(openssl rand -hex 32)
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: 'json-file'
      options: { max-size: '1m', max-file: '1' }
    restart: unless-stopped

volumes:
  switchyard-logs:
