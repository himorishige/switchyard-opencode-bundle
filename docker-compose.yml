# Explicit project name so container/volume names don't depend on the
# checkout directory name.
name: switchyard-opencode

services:
  switchyard:
    build: .
    container_name: switchyard-opencode
    ports:
      # Loopback only — never expose the router on the LAN.
      - '127.0.0.1:4100:4100'
    env_file:
      - .env
    volumes:
      - ./routes.toml:/app/routes.toml:ro
      # Named volume (not a bind mount — avoids host-permission surprises)
      # so the routing JSONL survives `up -d --force-recreate` (key
      # rotation) and image rebuilds. Retrieve it with `docker cp` /
      # scripts/stats-snapshot.sh, or read the aggregate at GET /v1/stats.
      - switchyard-logs:/app/logs
    # Adds the per-request routing JSONL on top of the image CMD.
    command:
      [
        '--config',
        '/app/routes.toml',
        '--host',
        '0.0.0.0',
        '--port',
        '4100',
        '--routing-log-file',
        '/app/logs/routing.jsonl',
      ]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:4100/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  switchyard-logs:
