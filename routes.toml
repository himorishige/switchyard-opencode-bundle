# Mac Switchyard: Lightning judge on node1 over Tailscale; GLM weak / Kimi strong.
# Thresholds are inherited, not recalibrated for the new weak model.
# Requires main 9a743e8 plus the verified local target/attachment patches.
schema_version = 1

[llm_clients.fireworks]
format = "openai_chat"
base_url = "https://api.fireworks.ai/inference/v1"
api_key_env = "FIREWORKS_API_KEY"

[llm_clients.lightning_judge]
format = "openai_chat"
base_url = "http://100.123.43.82:8000/v1"

[targets.classifier]
id = "judge"
llm_client = "lightning_judge"
extra_body = { temperature = 0, chat_template_kwargs = { enable_thinking = false } }

[targets.strong]
id = "accounts/fireworks/models/kimi-k3"
llm_client = "fireworks"

[targets.k3]
id = "accounts/fireworks/models/kimi-k3"
llm_client = "fireworks"

[targets.weak]
id = "accounts/fireworks/models/glm-5p3-flash"
llm_client = "fireworks"

[routes.auto]
id = "auto"
type = "llm_classifier"
mode = "capability"
classifier_target = "classifier"
strong_target = "strong"
weak_target = "weak"
base_threshold = 0.75
threshold_step = 0.1
classify_trigger = "new_session"
message_hash_fallback = true
recent_turn_window = 4

[routes.auto-esc]
id = "auto-esc"
type = "llm_classifier"
mode = "escalation"
classifier_target = "classifier"
strong_target = "strong"
weak_target = "weak"
escalation = { confirmations = 2 }

[routes.strong-only]
id = "strong-only"
type = "passthrough"
target = "strong"

[routes.weak-only]
id = "weak-only"
type = "passthrough"
target = "weak"

[routes.k3-only]
id = "k3-only"
type = "passthrough"
target = "k3"

[targets.fw_qwen_vl]
id = "accounts/fireworks/models/qwen3p7-plus"
llm_client = "fireworks"
extra_body = { reasoning_effort = "none" }

[routes.omni-vision]
id = "qwen3.7-plus"
type = "passthrough"
target = "fw_qwen_vl"