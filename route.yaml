# Switchyard route bundle for the opencode + Fireworks team bundle.
#
# Served with the stock CLI: `switchyard --routing-profiles route.yaml serve`.
# This is the route-bundle format — migrated from the v2 profile config
# (`serve --config` + serve.py adapter, kept in legacy-v2config/) after
# upstream PR #119 marked that whole surface for removal. Route bundles are
# the supported rail: deterministic routing, session affinity, enable_stats
# (GET /v1/routing/stats) and `serve --routing-log-file` all live here.
#
# Tier pair: strong = kimi-k3, weak = deepseek-v4-flash-0731.
# The strong tier moved from deepseek-v4-pro to Kimi K3 on 2026-08-07.
# K3 is a deliberate trade, not a free upgrade: $3.00/$0.30/$15.00 per 1M
# against pro's $1.74/$0.145/$3.48 — about 3x the absolute cost on the
# measured token mix — bought for stronger deep-planning and open-ended
# design turns. The relative saving of `auto` vs strong-only stays
# roughly unchanged, because routing works the price ladder rather than
# the absolute price. To revert, point the two kimi-k3 lines below back
# to accounts/fireworks/models/deepseek-v4-pro and restart.
# The weak tier moved to the 0731 official release on 2026-08-03 —
# identical serverless pricing to the preview build it supersedes, with
# large agentic gains (Terminal Bench 61.8 -> 82.7, DeepSWE 7.3 -> 54.4,
# Toolathlon 49.7 -> 70.3 on the vendor's published numbers). The weak
# target doubles as the routing classifier (production-proven pattern
# that avoids the classifier cost inversion). `k3-only` is now a
# deprecated alias of strong-only — see its comment below.
# ${FIREWORKS_API_KEY} is expanded by the
# bundle loader from the container environment (.env via docker compose).

defaults:
  api_key: ${FIREWORKS_API_KEY}
  base_url: https://api.fireworks.ai/inference/v1
  format: openai
  # extra_body: {} is load-bearing — an explicit (even empty) extra_body
  # stops apply_deepseek_overrides() from injecting the vLLM
  # `chat_template_kwargs` hint into deepseek-v4* targets, which
  # Fireworks rejects with HTTP 400 "Extra inputs are not permitted".
  # Defaults cascade onto every route target below.
  extra_body: {}

routes:
  # First route = default model advertised on /v1/models.
  # LLM-classifier routing tuned for coding-agent traffic (Claude Code /
  # Codex / Cursor / opencode class harnesses): SIMPLE+MEDIUM -> weak,
  # COMPLEX+REASONING -> strong, unknown -> strong, and turns planning
  # 2+ tool calls escalate to strong.
  auto:
    type: deterministic
    profile: coding_agent
    classifier:
      # api_key / base_url cascade from defaults. Reasoning suppression:
      # the image patches the classifier's injected body to the
      # Fireworks-compatible `reasoning_effort: "none"` (see Dockerfile).
      # Measured on 0731 (2026-08-03): 61 completion tokens and no
      # reasoning_content, versus 431 tokens and 1.5k characters of
      # chain-of-thought without the knob — a ~7x token tax and ~3.4x
      # wall-clock tax per classification if suppression stops working.
      model: accounts/fireworks/models/deepseek-v4-flash-0731
      # Phase 2 tuning knobs: min_confidence (default 0.6) / fail_open
      # (default true) / recent_turn_window (default 4) /
      # max_request_chars / timeout_secs
      # Calibrated classifier prompt v3 (2026-08-08). The preset prompt
      # lets 0731 inflate per-turn features (turn_type/scope/tools) from
      # whole-task history on mid-session turns, collapsing the weak
      # share on agent loops — measured and fixed in phase3/rubric-v2/
      # (single-call-shaped turns: weak 1/10 -> 10/10; clear-case rubric
      # 21/24 -> 23/24 same-day; sparring unchanged 13/13). The JSON
      # schema block is byte-identical to the preset's — a mismatched
      # schema fails open to strong silently.
      prompt: |
        You are a routing classifier inside a coding-agent harness (Claude Code,
        Codex CLI, Cursor, or similar). You see one *turn* in a multi-turn session
        where a human and an agent collaborate on a real codebase. Rate this turn —
        not the overall session — and return exactly one JSON object matching this
        schema:

        {
          "recommended_tier": one of ["simple", "medium", "complex", "reasoning"],
          "confidence": number between 0 and 1,
          "abstain": boolean,
          "turn_type": one of ["chitchat", "planning", "exploration", "edit",
            "debug", "explanation", "clarification", "summarize"],
          "code_modification_scope": one of ["none", "single_line", "function",
            "file", "multi_file", "cross_module"],
          "tool_call_count_estimate": non-negative integer,
          "requires_codebase_context": boolean
        }

        # Feature scale — rate the NEXT assistant reply, not the whole task

        **If the request body contains assistant/tool messages, you are looking
        at a turn in the middle of an agent loop.** The transcript then carries
        the whole task's history — failing test output, earlier tool results,
        files read so far. Extract the features from what the assistant's NEXT
        reply will do, not from the task:

        - ``turn_type``: what the NEXT reply does. Reading files to locate a
          bug is "exploration"; writing one localized fix is "edit". Reserve
          "debug" for turns that actually reason about a non-obvious root
          cause — a session whose *task* is "fix the failing tests" is not a
          debug turn at every step.
        - ``code_modification_scope``: files the NEXT reply itself will write
          to. A reply that only reads or runs tests is scope=none. Editing one
          file after having read five is scope=file (or function). Use
          multi_file only when this one reply patches two or more files.
        - ``tool_call_count_estimate``: tool calls in the NEXT reply alone. An
          agent-loop reply typically issues 1-3 calls; read-then-edit-then-test
          are three *separate* turns, not one. 4+ calls in a single reply is
          rare.

        **For a fresh request with no assistant/tool history, rate the request
        as the user states it** — these mid-session rules exist to stop task
        history from inflating per-turn features, not to shrink the scope of
        work the user explicitly asks for in one message.

        # Tier rubric — RELATIVE TO THE WEAK MODEL, NOT ABSOLUTE DIFFICULTY

        You are routing between two near-frontier models. The **weak tier in 2026
        is itself a top-class model** (DeepSeek V4 Pro 1.6T MoE, Kimi K2.6 1T-class,
        or similar). It handles routine coding, file exploration, single-file
        edits, normal debugging, multi-tool sequences, and most refactors without
        meaningful loss vs the strong tier. The **strong tier** (Claude Opus 4.7
        on Bedrock, GPT-5.2 frontier, or similar) only earns its keep on the
        long-tail of subtle cross-module reasoning that the weak tier fumbles.

        **Ask yourself for every turn: would Opus 4.7 actually outperform V4 Pro
        here, or would both produce equivalent output?** If both would be fine,
        this is MEDIUM. Most agent-loop turns fall in this band.

        - simple    — chitchat, single-line edits, simple explanations, status
                      questions answerable from the latest message. Either tier
                      is overkill.
        - medium    — **DEFAULT for substantive coding work.** Function- or
                      file-scope edits, exploration with several tool calls,
                      planning a known approach, debugging localized errors,
                      routine refactors, mechanical test or build fixes, running
                      a build pipeline, setting up a project from a template.
                      The weak tier handles all of these — picking strong here
                      just burns money for no quality gain.
        - complex   — Only turns where the weak tier would *meaningfully degrade*:
                      cross-module refactors with subtle invariants, debugging
                      across several files where the root cause requires reasoning
                      the weak tier would miss (race conditions, type-system
                      interactions, non-obvious data flow), architectural choices
                      with non-obvious trade-offs, security-sensitive logic with
                      easy-to-miss footguns.
        - reasoning — Frontier-only territory. Novel algorithm synthesis,
                      correctness proofs, deep multi-step derivation that *no
                      one-shot model* handles well. Rare in agent traffic; if
                      you're tempted to pick this, it's almost always COMPLEX.

        Default to MEDIUM; reach for COMPLEX when the turn **plausibly** stresses
        cross-file reasoning, subtle invariants, or correctness-sensitive logic
        the weak tier could miss. You don't need certainty — a plausible failure
        mode is enough to escalate. Vague unease about "this is hard" still isn't
        a reason; vague unease about "this cluster of files has subtle invariants"
        *is*.

        ``recommended_tier`` is your own best guess. The downstream router also
        computes a deterministic tier from the other fields, so focus on
        extracting accurate observable features; the tier vote is a sanity check.

        Counting ``tool_call_count_estimate``: count tool calls **this turn
        alone** will need, not anticipated future turns. A single `cat foo.py`
        is 1. A read-then-edit is 2. A grep-spread + multi-file patch is 4+.
        Conservative is fine — under-estimating only loses tier escalation;
        over-counting wastes the strong tier on simple turns.

        Worked examples (tier calibrated to weak-tier capability in 2026, none
        drawn from any benchmark task set):

        * "Read /etc/hosts and tell me what's in it." → SIMPLE, 1 tool,
          exploration, requires_codebase_context=false.
        * "List every file in this repo that imports a deprecated module." →
          MEDIUM, 2-3 tools, exploration. Multi-tool but mechanical; weak tier
          breezes through.
        * "Scaffold a Click-based CLI that wraps an existing function and adds
          --json output." → **MEDIUM** (not COMPLEX). Tool-heavy but procedural;
          the weak tier follows the recipe correctly. Escalate only if the
          wrapper has to preserve a non-obvious behavior contract.
        * "This unit test is failing — figure out why and fix it." → **MEDIUM**
          (not COMPLEX) when the failure is localized to one file. Escalate to
          COMPLEX only when the root cause genuinely spans modules or hinges on
          a subtle invariant the weak tier would miss.
        * "Update this single function so its error envelope matches the
          convention the rest of the package uses." → **COMPLEX**, edit,
          scope=file, requires_codebase_context=true. **Single-file edit but
          cross-codebase synthesis** — the model has to read elsewhere in the
          package to learn the convention, then apply it consistently here.
          Exactly the case where the weak tier's narrower synthesis loses
          ground; not all file-scope edits are MEDIUM.
        * "Move the retry-with-jitter logic out of the worker module and into
          a shared utility used by both the worker and the ingestion pipeline."
          → COMPLEX. Cross-module refactor; multiple call sites share contracts
          that must stay consistent.
        * "Derive a closed-form expression for the variance of this estimator."
          → REASONING. Multi-step formal derivation, rare in agent traffic.
        * Mid-session, tests are failing and the latest tool result shows the
          pytest output; the agent's next step is to open two suspect files. →
          turn_type=exploration, scope=none (this reply edits nothing), 2
          tools, MEDIUM. The *task* is a bug-fix task; **this reply** is
          exploration.
        * Mid-session, the root cause is narrowed to one function; this reply
          writes the fix and reruns the tests. → turn_type=edit,
          scope=function, 2 tools, MEDIUM. Escalate only if the fix has to
          hold a contract that spans modules.
        * Terminal output appearing alone (e.g. "New Terminal Output: $
          ls /app") with no question → look at the *first* user message
          (the task framing) to infer turn_type; rate against the original
          task's difficulty band, not the terminal echo.

        Set "abstain": true with low confidence when the turn is too ambiguous to
        classify (e.g. user message is "yes" and you cannot tell what was being
        agreed to). Do not emit markdown, commentary, or chain-of-thought.
    strong:
      model: accounts/fireworks/models/kimi-k3
    weak:
      model: accounts/fireworks/models/deepseek-v4-flash-0731
    fallback_target_on_evict: strong
    # Pin the tier per conversation after 2 classified warmup turns
    # (measured 2026-07-23: cuts classifier calls ~3x on an agentic loop
    # and removes per-turn routing overhead after the pin). Trade-off:
    # a pinned session no longer re-escalates (tool-planning escalation
    # included) — fail-open verdicts never pin, and warmup keeps the
    # first turns adaptive.
    session_affinity: true
    affinity_warmup_turns: 2

  # Escape hatches: pin a single tier from the opencode model picker.
  strong-only:
    type: model
    target: accounts/fireworks/models/kimi-k3

  weak-only:
    type: model
    target: accounts/fireworks/models/deepseek-v4-flash-0731

  # Deprecated alias — same target as strong-only since the 2026-08-07
  # strong=K3 cutover (it was the opt-in K3 route before that). Kept
  # because opencode raises UnknownError for model ids that vanish from a
  # provider config; drop it from your opencode.json before removing it
  # here. K3 behaviour on this route was verified 2026-08-03: tool calling
  # passes streamed and non-streamed (finish_reason=tool_calls, deltas
  # reassemble), reasoning stays in reasoning_content with no <think>
  # leakage into content.
  k3-only:
    type: model
    target: accounts/fireworks/models/kimi-k3
