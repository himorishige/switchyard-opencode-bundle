# Switchyard route bundle for the opencode + Fireworks team bundle.
#
# Served with the stock CLI: `switchyard --routing-profiles route.yaml serve`.
# This is the route-bundle format — migrated from the v2 profile config
# (`serve --config` + serve.py adapter, kept in legacy-v2config/) after
# upstream PR #119 marked that whole surface for removal. Route bundles are
# the supported rail: deterministic routing, session affinity, enable_stats
# (GET /v1/routing/stats) and `serve --routing-log-file` all live here.
#
# Tier pair: strong = kimi-k3, weak = deepseek-v4-flash-0731.
# The strong tier moved from deepseek-v4-pro to Kimi K3 on 2026-08-07.
# K3 is a deliberate trade, not a free upgrade: $3.00/$0.30/$15.00 per 1M
# against pro's $1.74/$0.145/$3.48 — about 3x the absolute cost on the
# measured token mix — bought for stronger deep-planning and open-ended
# design turns. The relative saving of `auto` vs strong-only stays
# roughly unchanged, because routing works the price ladder rather than
# the absolute price. To revert, point the two kimi-k3 lines below back
# to accounts/fireworks/models/deepseek-v4-pro and restart.
# The weak tier moved to the 0731 official release on 2026-08-03 —
# identical serverless pricing to the preview build it supersedes, with
# large agentic gains (Terminal Bench 61.8 -> 82.7, DeepSWE 7.3 -> 54.4,
# Toolathlon 49.7 -> 70.3 on the vendor's published numbers). The weak
# target doubles as the routing classifier (production-proven pattern
# that avoids the classifier cost inversion). `k3-only` is now a
# deprecated alias of strong-only — see its comment below.
# ${FIREWORKS_API_KEY} is expanded by the
# bundle loader from the container environment (.env via docker compose).

defaults:
  api_key: ${FIREWORKS_API_KEY}
  base_url: https://api.fireworks.ai/inference/v1
  format: openai
  # extra_body: {} is load-bearing — an explicit (even empty) extra_body
  # stops apply_deepseek_overrides() from injecting the vLLM
  # `chat_template_kwargs` hint into deepseek-v4* targets, which
  # Fireworks rejects with HTTP 400 "Extra inputs are not permitted".
  # Defaults cascade onto every route target below.
  extra_body: {}

routes:
  # First route = default model advertised on /v1/models.
  # LLM-classifier routing tuned for coding-agent traffic (Claude Code /
  # Codex / Cursor / opencode class harnesses): SIMPLE+MEDIUM -> weak,
  # COMPLEX+REASONING -> strong, unknown -> strong, and turns planning
  # 2+ tool calls escalate to strong.
  auto:
    type: deterministic
    profile: coding_agent
    classifier:
      # api_key / base_url cascade from defaults. Reasoning suppression:
      # the image patches the classifier's injected body to the
      # Fireworks-compatible `reasoning_effort: "none"` (see Dockerfile).
      # Measured on 0731 (2026-08-03): 61 completion tokens and no
      # reasoning_content, versus 431 tokens and 1.5k characters of
      # chain-of-thought without the knob — a ~7x token tax and ~3.4x
      # wall-clock tax per classification if suppression stops working.
      model: accounts/fireworks/models/deepseek-v4-flash-0731
      # Phase 2 tuning knobs: min_confidence (default 0.6) / fail_open
      # (default true) / recent_turn_window (default 4) /
      # max_request_chars / timeout_secs
    strong:
      model: accounts/fireworks/models/kimi-k3
    weak:
      model: accounts/fireworks/models/deepseek-v4-flash-0731
    fallback_target_on_evict: strong
    # Pin the tier per conversation after 2 classified warmup turns
    # (measured 2026-07-23: cuts classifier calls ~3x on an agentic loop
    # and removes per-turn routing overhead after the pin). Trade-off:
    # a pinned session no longer re-escalates (tool-planning escalation
    # included) — fail-open verdicts never pin, and warmup keeps the
    # first turns adaptive.
    session_affinity: true
    affinity_warmup_turns: 2

  # Escape hatches: pin a single tier from the opencode model picker.
  strong-only:
    type: model
    target: accounts/fireworks/models/kimi-k3

  weak-only:
    type: model
    target: accounts/fireworks/models/deepseek-v4-flash-0731

  # Deprecated alias — same target as strong-only since the 2026-08-07
  # strong=K3 cutover (it was the opt-in K3 route before that). Kept
  # because opencode raises UnknownError for model ids that vanish from a
  # provider config; drop it from your opencode.json before removing it
  # here. K3 behaviour on this route was verified 2026-08-03: tool calling
  # passes streamed and non-streamed (finish_reason=tool_calls, deltas
  # reassemble), reasoning stays in reasoning_content with no <think>
  # leakage into content.
  k3-only:
    type: model
    target: accounts/fireworks/models/kimi-k3
